[project]
name = "practical-ai-integration"
version = "0.1.0"
description = "Demos for the Practical AI Integration presentation: a help desk that gains AI features one at a time"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.0",
    "azure-identity",
    "python-dotenv",
    "pydantic>=2.0",
    "duckdb>=1.4",
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["helpdesk"]
